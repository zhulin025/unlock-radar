name: Sync global unlock data

on:
  schedule:
    - cron: "25 23 * * 1-5"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill start date (YYYY-MM-DD)"
        required: false
      to:
        description: "Backfill end date (YYYY-MM-DD)"
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'UnlockRadar/1.0 zhulin025@users.noreply.github.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync HKEX and SEC filings
        run: |
          if [ -n "${{ inputs.from }}" ]; then
            npm run data:sync -- --from=${{ inputs.from }} --to=${{ inputs.to }}
          else
            npm run data:sync
          fi
      - run: npm run data:build
      - run: npm run build:pages
      - name: Commit validated data updates
        run: |
          git config user.name "unlock-radar-bot"
          git config user.email "unlock-radar-bot@users.noreply.github.com"
          git add data/official-events.json
          git diff --cached --quiet || git commit -m "data: sync HKEX and SEC unlock events"
          git push
