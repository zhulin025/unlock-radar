name: Sync macro and earnings calendar

on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Start date (YYYY-MM-DD)"
        required: false
      to:
        description: "End date (YYYY-MM-DD)"
        required: false

permissions:
  contents: write

concurrency:
  group: market-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Nasdaq, Federal Reserve and BEA calendars
        run: |
          if [ -n "${{ inputs.from }}" ]; then
            npm run market:sync -- --from=${{ inputs.from }} --to=${{ inputs.to }}
          else
            npm run market:sync
          fi
      - name: Validate production build
        run: npm run build:pages
      - name: Commit source-backed calendar update
        run: |
          git config user.name "unlock-radar-bot"
          git config user.email "unlock-radar-bot@users.noreply.github.com"
          git add public/data/market-calendar.json
          git diff --cached --quiet && exit 0
          git commit -m "data: sync macro and earnings calendar"
          git pull --rebase origin main
          git push origin HEAD:main
